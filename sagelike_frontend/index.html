<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SageLite AI Workspace</title>
    <!-- Tailwind CSS for modern, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js for clean Markdown rendering in chat bubbles -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex overflow-hidden">

    <!-- LEFT SIDEBAR: Navigation, Modes & History -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col justify-between hidden md:flex">
        <div class="p-4">
            <!-- App Branding -->
            <div class="flex items-center space-x-2 mb-6">
                <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center font-bold text-lg">S</div>
                <span class="text-xl font-semibold tracking-tight">SageLite</span>
            </div>

            <!-- New Chat Button -->
            <button onclick="clearChat()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 px-4 rounded-lg transition duration-200 flex items-center justify-center space-x-2 mb-6">
                <span>+ New Chat</span>
            </button>

            <!-- Mode / Persona Selector -->
            <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Select AI Mode</div>
            <div class="space-y-1" id="persona-list">
                <button onclick="setPersona('general', this)" class="persona-btn w-full text-left px-3 py-2 rounded-lg text-sm font-medium bg-slate-800 text-white transition">🌟 General Assistant</button>
                <button onclick="setPersona('programming', this)" class="persona-btn w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">💻 Senior Engineer</button>
                <button onclick="setPersona('tutor', this)" class="persona-btn w-full text-left px-3 py-2 rounded-lg text-sm font-medium text-slate-400 hover:bg-slate-800 hover:text-white transition">🎓 Socratic Tutor</button>
            </div>
        </div>

        <!-- Sidebar Footer / Status -->
        <div class="p-4 border-t border-slate-800 text-xs text-slate-500 flex items-center space-x-2">
            <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span>
            <span>Local Engine: Ollama (Llama 3.2)</span>
        </div>
    </aside>

    <!-- MAIN CHAT AREA -->
    <main class="flex-1 flex flex-col h-full bg-slate-950">
        
        <!-- Top Navbar -->
        <header class="h-14 border-b border-slate-800 flex items-center justify-between px-6 bg-slate-900/50 backdrop-blur">
            <div class="flex items-center space-x-2">
                <span class="text-sm font-medium text-slate-400">Mode:</span>
                <span id="current-mode-label" class="text-sm font-semibold text-indigo-400 uppercase tracking-wide">General</span>
            </div>
            <div class="text-xs text-slate-400 bg-slate-800 px-3 py-1 rounded-full border border-slate-700">RAG Enabled 🟢</div>
        </header>

        <!-- Chat History Scroll Container -->
        <div id="chat-container" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-6">
            <!-- Welcome State -->
            <div class="max-w-2xl mx-auto text-center py-12 space-y-3">
                <h1 class="text-3xl font-bold tracking-tight">How can I help you today?</h1>
                <p class="text-slate-400 text-sm">Running locally with FastAPI, ChromaDB RAG, and Ollama.</p>
            </div>
        </div>

        <!-- Input Bar Area -->
        <div class="p-4 md:p-6 bg-slate-950 border-t border-slate-800">
            <div class="max-w-4xl mx-auto relative">
                <form id="chat-form" onsubmit="sendMessage(event)" class="flex items-center bg-slate-900 border border-slate-700 rounded-xl focus-within:border-indigo-500 transition shadow-lg">
                    <input 
                        type="text" 
                        id="user-input" 
                        placeholder="Ask anything about your local project or knowledge base..." 
                        class="flex-1 bg-transparent px-4 py-3.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none"
                        autocomplete="off"
                        required
                    >
                    <button type="submit" id="send-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white p-2.5 rounded-lg m-1.5 transition flex items-center justify-center">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M12 5l7 7-7 7"></path></svg>
                    </button>
                </form>
                <div class="text-center mt-2 text-[11px] text-slate-500">SageLite AI can make mistakes. Verify important local info.</div>
            </div>
        </div>
    </main>

    <!-- Frontend JavaScript Controller -->
    <script>
        let currentPersona = "general";

        function setPersona(persona, element) {
            currentPersona = persona;
            document.getElementById("current-mode-label").innerText = persona;
            
            // Highlight active button in sidebar
            document.querySelectorAll(".persona-btn").forEach(btn => {
                btn.classList.remove("bg-slate-800", "text-white");
                btn.classList.add("text-slate-400");
            });
            element.classList.add("bg-slate-800", "text-white");
            element.classList.remove("text-slate-400");
        }

        function clearChat() {
            document.getElementById("chat-container").innerHTML = `
                <div class="max-w-2xl mx-auto text-center py-12 space-y-3">
                    <h1 class="text-3xl font-bold tracking-tight">How can I help you today?</h1>
                    <p class="text-slate-400 text-sm">Running locally with FastAPI, ChromaDB RAG, and Ollama.</p>
                </div>
            `;
        }

        async function sendMessage(event) {
            event.preventDefault();
            const inputField = document.getElementById("user-input");
            const question = inputField.value.trim();
            if (!question) return;

            const chatContainer = document.getElementById("chat-container");

            // Remove welcome screen if it's the first message
            if (chatContainer.querySelector(".text-center")) {
                chatContainer.innerHTML = "";
            }

            // 1. Append User Message Bubble
            chatContainer.innerHTML += `
                <div class="flex justify-end">
                    <div class="bg-indigo-600 text-white max-w-xl rounded-2xl px-4 py-3 text-sm shadow-md">${escapeHtml(question)}</div>
                </div>
            `;
            inputField.value = "";
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // 2. Append Loading Assistant Bubble
            const loadingId = "loading-" + Date.now();
            chatContainer.innerHTML += `
                <div id="${loadingId}" class="flex items-start space-x-3">
                    <div class="w-8 h-8 bg-slate-800 border border-slate-700 rounded-lg flex items-center justify-center font-bold text-xs text-indigo-400">AI</div>
                    <div class="bg-slate-900 border border-slate-800 text-slate-200 max-w-2xl rounded-2xl px-4 py-3 text-sm shadow-sm flex items-center space-x-2">
                        <span class="w-2 h-2 bg-indigo-500 rounded-full animate-bounce"></span>
                        <span class="w-2 h-2 bg-indigo-500 rounded-full animate-bounce [animation-delay:0.2s]"></span>
                        <span class="w-2 h-2 bg-indigo-500 rounded-full animate-bounce [animation-delay:0.4s]"></span>
                    </div>
                </div>
            `;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                // 3. Send Request to FastAPI Backend
                const response = await fetch("http://localhost:8000/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ question: question, persona: currentPersona })
                });

                if (!response.ok) throw new Error("Failed to reach backend server.");

                const data = await response.json();
                
                // 4. Replace Loading Bubble with AI Response (Parsed with Markdown)
                const loadingBubble = document.getElementById(loadingId);
                loadingBubble.outerHTML = `
                    <div class="flex items-start space-x-3">
                        <div class="w-8 h-8 bg-slate-800 border border-slate-700 rounded-lg flex items-center justify-center font-bold text-xs text-indigo-400">AI</div>
                        <div class="bg-slate-900 border border-slate-800 text-slate-200 max-w-2xl rounded-2xl px-4 py-3 text-sm shadow-sm prose prose-invert">
                            ${marked.parse(data.answer)}
                        </div>
                    </div>
                `;
            } catch (error) {
                const loadingBubble = document.getElementById(loadingId);
                loadingBubble.outerHTML = `
                    <div class="flex items-start space-x-3">
                        <div class="w-8 h-8 bg-red-900/50 border border-red-700 rounded-lg flex items-center justify-center font-bold text-xs text-red-400">!</div>
                        <div class="bg-red-950/50 border border-red-900 text-red-200 max-w-xl rounded-2xl px-4 py-3 text-sm">
                            Error: Could not connect to FastAPI server. Make sure Uvicorn is running.
                        </div>
                    </div>
                `;
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
